<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berita Acara Validasi HP Tidak Potensial</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  html,body{margin:0;height:100%;background:#f3f8ff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<script src="config.js"></script>
<script>
  // Meneruskan parameter link (mis. ?t=... untuk tanda tangan Tim Regional) ke Apps Script.
  var f = document.createElement('iframe');
  f.title = 'Berita Acara';
  f.setAttribute('allow', 'clipboard-write');
  f.src = window.BA_CONFIG.API_URL + (location.search || '');
  document.body.appendChild(f);
</script>
</body>
</html>
